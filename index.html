<!DOCTYPE html>
<html lang="id" class="h-full bg-laut-900 text-laut-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#021024">
  <title>HT KP Nelayan</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            laut: {
              950: '#010812',
              900: '#021024',
              800: '#052659',
              700: '#5483B3',
              300: '#7DA0CA',
              100: '#C1E8FF'
            },
            oranye: {
              500: '#FF7A00',
              600: '#E66D00'
            },
            hijau: '#11B846',
            merah: '#E33535'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Courier New', 'monospace']
          }
        }
      }
    }
  </script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- PeerJS for WebRTC Mesh Audio -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    /* Mencegah zoom dan efek scroll karet di HP */
    body {
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior-y: none;
    }
    
    /* Efek Layar HT */
    .layar-ht {
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
      background: linear-gradient(180deg, #C1E8FF 0%, #7DA0CA 100%);
      color: #021024;
    }

    /* Animasi Tombol Bicara */
    .tombol-ptt {
      transition: all 0.15s ease-out;
      box-shadow: 0 12px 0 #E66D00, 0 15px 20px rgba(0,0,0,0.5);
    }
    
    .tombol-ptt:active, .tombol-ptt.aktif {
      transform: translateY(12px);
      box-shadow: 0 0 0 #E66D00, 0 3px 5px rgba(0,0,0,0.5);
      background-color: #FF9500; /* Sedikit lebih terang saat ditekan */
    }

    .tombol-ptt-siaga {
      transition: all 0.15s ease-out;
      box-shadow: 0 12px 0 #052659, 0 15px 20px rgba(0,0,0,0.5);
    }
    
    .tombol-ptt-siaga:active, .tombol-ptt-siaga.aktif {
      transform: translateY(12px);
      box-shadow: 0 0 0 #052659, 0 3px 5px rgba(0,0,0,0.5);
    }

    /* Gelombang Sinyal */
    @keyframes sinyal-kedip {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }
    .animasi-sinyal {
      animation: sinyal-kedip 1s infinite ease-in-out;
    }
  </style>
</head>

<body class="h-full flex flex-col justify-between max-w-md mx-auto bg-laut-900 border-x border-laut-800 shadow-2xl relative overflow-hidden select-none">

  <header class="p-4 bg-laut-800 flex items-center justify-between z-10 shadow-lg">
    <div class="flex items-center space-x-3">
      <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-md">
        <i class="fa-solid fa-anchor text-laut-800 text-2xl"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold text-white tracking-wide">HT KP NELAYAN</h1>
        <div class="flex items-center gap-1.5 mt-0.5">
          <div id="statusLed" class="w-2.5 h-2.5 rounded-full bg-hijau"></div>
          <p class="text-xs text-laut-100" id="teksKoneksi">Terhubung ke Radio</p>
        </div>
      </div>
    </div>
    
    <button id="btnPengaturan" class="p-3 bg-laut-900 hover:bg-laut-950 active:scale-95 text-white rounded-xl shadow-inner border border-laut-700">
      <i class="fa-solid fa-gear text-lg"></i>
    </button>
  </header>

  <main class="flex-1 p-4 flex flex-col space-y-4 overflow-hidden relative">
    
    <!-- Layar LCD HT -->
    <div class="layar-ht rounded-xl p-4 border-4 border-laut-800 flex flex-col justify-between relative overflow-hidden z-10 min-h-[160px]">
      
      <!-- Info Jalur & Sinyal -->
      <div class="flex justify-between items-start font-bold mb-2 border-b-2 border-laut-700/30 pb-2">
        <div>
          <span class="text-xs uppercase tracking-wider text-laut-800/80">JALUR FREKUENSI</span>
          <div id="tampilJalur" class="text-xl flex items-center gap-2">
            <i class="fa-solid fa-tower-broadcast"></i> LAUT-01
          </div>
        </div>
        <div class="text-right">
          <span class="text-xs uppercase tracking-wider text-laut-800/80">ANGGOTA AKTIF</span>
          <div class="text-xl flex items-center justify-end gap-2">
            <i class="fa-solid fa-users"></i> <span id="tampilJumlahAnggota">1</span>
          </div>
        </div>
      </div>

      <!-- Status Komunikasi (Siaga/Bicara) -->
      <div class="my-auto text-center py-2">
        <div id="teksStatus" class="text-sm font-bold uppercase mb-1 text-laut-800">
          STATUS RADIO
        </div>
        <div id="teksAktivitas" class="text-3xl font-black tracking-wider truncate">
          SIAGA
        </div>
        <div id="teksNamaPanggilan" class="text-sm font-bold text-laut-800 mt-2 bg-white/30 inline-block px-3 py-1 rounded-full">
          NAMA: SAYA SENDIRI
        </div>
      </div>
    </div>

    <div class="bg-laut-800/50 rounded-xl p-3 border border-laut-700 flex flex-col flex-1 max-h-48">
      <div class="flex justify-between items-center text-sm font-bold text-laut-100 mb-3 border-b border-laut-700 pb-2">
        <span><i class="fa-solid fa-ship mr-2"></i> Kapal / Anggota di Jalur Ini</span>
      </div>
      
      <div id="daftarAnggota" class="overflow-y-auto space-y-2 pr-1 flex-1 text-sm">
        <!-- Template Anggota -->
        <div class="flex justify-between items-center bg-laut-900 p-3 rounded-lg border-l-4 border-hijau shadow">
          <span class="font-bold text-white">Saya (Nama Kapal)</span>
          <span class="text-xs bg-hijau/20 text-hijau px-2 py-1 rounded">SIAGA</span>
        </div>
      </div>
    </div>
  </main>

  <footer class="p-6 bg-laut-950 border-t-2 border-laut-800 flex flex-col items-center justify-center relative pb-10">
    
    <!-- Indikator Visualisasi Suara -->
    <div class="w-full h-8 mb-6 flex items-end justify-center gap-1 opacity-50" id="visualizerContainer">
      <!-- Bar suara akan digenerate lewat JS -->
    </div>

    <!-- Tombol Push to Talk -->
    <button id="tombolBicara" class="tombol-ptt-siaga w-full py-8 rounded-2xl bg-laut-700 text-white flex flex-col items-center justify-center cursor-pointer select-none border-2 border-laut-300">
      <i id="ikonBicara" class="fa-solid fa-microphone text-5xl mb-3"></i>
      <span id="labelBicara" class="text-2xl font-black tracking-wider uppercase">TEKAN UNTUK BICARA</span>
    </button>

    <div class="mt-6 text-center">
      <p class="text-sm text-laut-300"><i class="fa-solid fa-circle-info"></i> Gantian ngomong, jangan bersamaan.</p>
    </div>
  </footer>

  <div id="modalPengaturan" class="fixed inset-0 bg-laut-950/90 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-laut-900 border-2 border-laut-700 rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl">
      
      <div class="bg-laut-800 p-4 flex justify-between items-center border-b border-laut-700">
        <h3 class="font-bold text-white text-lg flex items-center gap-2">
          <i class="fa-solid fa-sliders text-oranye-500"></i> Pengaturan Radio
        </h3>
        <button id="btnTutupPengaturan" class="text-laut-100 hover:text-white p-2 bg-laut-900 rounded-lg">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <div class="p-5 space-y-5">
        <!-- Ganti Identitas & Jalur -->
        <div class="space-y-4 bg-laut-800 p-4 rounded-xl border border-laut-700">
          <div>
            <label class="block text-sm font-bold text-laut-100 mb-2">Nama Kapal / Panggilan Anda</label>
            <input type="text" id="inputNama" placeholder="Contoh: BERKAH LAUT 01" class="w-full bg-laut-950 border border-laut-700 rounded-lg px-4 py-3 text-white font-bold focus:border-oranye-500 outline-none text-lg uppercase">
          </div>

          <div>
            <label class="block text-sm font-bold text-laut-100 mb-2">Pilih Jalur (Frekuensi)</label>
            <input type="text" id="inputJalur" placeholder="LAUT-01" class="w-full bg-laut-950 border border-laut-700 rounded-lg px-4 py-3 text-white font-bold focus:border-oranye-500 outline-none text-lg uppercase mb-2">
            <button id="btnSimpanJalur" class="w-full bg-hijau hover:bg-green-600 text-white font-bold px-4 py-3 rounded-lg text-lg shadow-md active:translate-y-1 transition-transform">
              <i class="fa-solid fa-check mr-2"></i> SIMPAN & GABUNG JALUR
            </button>
          </div>
        </div>

        <!-- Bagikan Link -->
        <div class="border-t border-laut-700 pt-4 flex flex-col items-center justify-center space-y-3">
          <p class="text-sm text-laut-100 font-bold text-center">Ajak teman masuk ke jalur ini:</p>
          <div id="qrcode" class="p-3 bg-white rounded-xl shadow-lg"></div>
          <button id="btnBagikanLink" class="w-full bg-laut-700 hover:bg-laut-600 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 shadow-md">
            <i class="fa-solid fa-share-nodes"></i> Bagikan Link Ke WhatsApp
          </button>
        </div>

        <!-- Opsi Tambahan -->
        <div class="flex justify-between items-center text-sm font-bold text-laut-100 pt-2">
          <span>Suara Kresek Radio (Efek)</span>
          <input type="checkbox" id="toggleKresek" checked class="w-6 h-6 accent-oranye-500">
        </div>
      </div>
    </div>
  </div>

  <script>
    // State Aplikasi
    const APP = {
      nama: localStorage.getItem('ht_kp_nama') || 'NELAYAN-' + Math.floor(100 + Math.random() * 900),
      jalur: ambilJalurDariUrl() || 'LAUT-01',
      peer: null,
      idSaya: null,
      streamSaya: null,
      koneksiData: new Map(), // PeerID -> DataConnection
      panggilanSuara: new Map(), // PeerID -> MediaCall
      anggotaAktif: new Map(), // PeerID -> { nama: string }
      sedangBicara: false,
      sedangMendengar: false,
      namaPembicaraAktif: null,
      audioCtx: null,
      analyserNode: null,
      efekKresekAktif: true
    };

    function ambilJalurDariUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('jalur') ? params.get('jalur').toUpperCase() : null;
    }

    // Elemen DOM
    const ui = {
      statusLed: document.getElementById('statusLed'),
      teksKoneksi: document.getElementById('teksKoneksi'),
      tampilJalur: document.getElementById('tampilJalur'),
      tampilJumlahAnggota: document.getElementById('tampilJumlahAnggota'),
      teksStatus: document.getElementById('teksStatus'),
      teksAktivitas: document.getElementById('teksAktivitas'),
      teksNamaPanggilan: document.getElementById('teksNamaPanggilan'),
      daftarAnggota: document.getElementById('daftarAnggota'),
      
      tombolBicara: document.getElementById('tombolBicara'),
      ikonBicara: document.getElementById('ikonBicara'),
      labelBicara: document.getElementById('labelBicara'),
      visualizerContainer: document.getElementById('visualizerContainer'),
      
      modalPengaturan: document.getElementById('modalPengaturan'),
      inputNama: document.getElementById('inputNama'),
      inputJalur: document.getElementById('inputJalur')
    };

    function siapkanAudio() {
      if (!APP.audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        APP.audioCtx = new AudioContext();
        APP.analyserNode = APP.audioCtx.createAnalyser();
        APP.analyserNode.fftSize = 32; // Lebih kecil = bar visualizer lebih sedikit & besar
      }
      if (APP.audioCtx.state === 'suspended') {
        APP.audioCtx.resume();
      }
    }

    // Bunyi Kresek (Squelch) khas HT saat mulai/berhenti bicara
    function bunyiKresekHT() {
      if (!APP.efekKresekAktif || !APP.audioCtx) return;
      try {
        const bufferSize = APP.audioCtx.sampleRate * 0.1; // 100ms
        const buffer = APP.audioCtx.createBuffer(1, bufferSize, APP.audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1; // White noise
        }
        
        const noise = APP.audioCtx.createBufferSource();
        noise.buffer = buffer;
        
        const filter = APP.audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1500;
        
        const gain = APP.audioCtx.createGain();
        gain.gain.setValueAtTime(0.2, APP.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, APP.audioCtx.currentTime + 0.08);
        
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(APP.audioCtx.destination);
        
        noise.start();
      } catch (e) { console.warn('Efek suara gagal:', e); }
    }

    // Bunyi "Tit-tit" saat selesai bicara (Roger Beep)
    function bunyiSelesaiGanti() {
      if (!APP.efekKresekAktif || !APP.audioCtx) return;
      try {
        const osc = APP.audioCtx.createOscillator();
        const gain = APP.audioCtx.createGain();
        osc.type = 'sine';
        const now = APP.audioCtx.currentTime;
        
        osc.frequency.setValueAtTime(1000, now);
        osc.frequency.setValueAtTime(1500, now + 0.05);
        
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        
        osc.connect(gain);
        gain.connect(APP.audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      } catch (e) { console.warn('Efek suara roger beep gagal:', e); }
    }

    async function aktifkanMikrofon() {
      try {
        APP.streamSaya = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },
          video: false
        });

        // Mute mic bawaannya, baru dinyalakan saat tombol PTT ditekan
        APP.streamSaya.getAudioTracks().forEach(track => track.enabled = false);

        siapkanAudio();
        const source = APP.audioCtx.createMediaStreamSource(APP.streamSaya);
        source.connect(APP.analyserNode);
        
        return true;
      } catch (err) {
        console.error('Gagal akses mic:', err);
        alert('Mohon izinkan akses Mikrofon agar bisa dipakai berbicara.');
        return false;
      }
    }

    function sambungkanKeJaringan() {
      ui.teksKoneksi.innerText = "Mencari sinyal...";
      ui.statusLed.className = "w-2.5 h-2.5 rounded-full bg-oranye-500 animasi-sinyal";

      // Bikin ID unik tapi terikat dengan nama jalur agar gampang saling ketemu
      const namaJalurBersih = APP.jalur.replace(/[^A-Z0-9]/gi, '').toUpperCase();
      const acak = Math.random().toString(36).substring(2, 6);
      APP.idSaya = `htnelayan-${namaJalurBersih}-${acak}`;

      // Koneksi ke server PeerJS publik
      APP.peer = new Peer(APP.idSaya, { debug: 1 });

      APP.peer.on('open', (id) => {
        ui.teksKoneksi.innerText = "Sinyal Bagus";
        ui.statusLed.className = "w-2.5 h-2.5 rounded-full bg-hijau";
        perbaruiTampilan();
        
        // Broadcast kehadiran ke semua yang mungkin konek
        kirimDataKeSemua({ tipe: 'MASUK', idPeer: APP.idSaya, nama: APP.nama });
      });

      // Menerima sambungan data (untuk teks/sinyal tombol)
      APP.peer.on('connection', (koneksi) => {
        aturKoneksiData(koneksi);
      });

      // Menerima panggilan suara
      APP.peer.on('call', (panggilan) => {
        panggilan.answer(APP.streamSaya);
        panggilan.on('stream', (streamLain) => {
          pasangAudioOrangLain(panggilan.peer, streamLain);
        });
        APP.panggilanSuara.set(panggilan.peer, panggilan);
      });

      APP.peer.on('error', (err) => {
        ui.teksKoneksi.innerText = "Sinyal Putus";
        ui.statusLed.className = "w-2.5 h-2.5 rounded-full bg-merah";
      });
    }

    function aturKoneksiData(koneksi) {
      APP.koneksiData.set(koneksi.peer, koneksi);

      koneksi.on('open', () => {
        // Kenalan (kirim nama)
        koneksi.send({ tipe: 'KENALAN', idPeer: APP.idSaya, nama: APP.nama });

        // Mulai telepon audio di balik layar jika belum
        if (!APP.panggilanSuara.has(koneksi.peer) && APP.streamSaya) {
          const panggilan = APP.peer.call(koneksi.peer, APP.streamSaya);
          panggilan.on('stream', (streamLain) => {
            pasangAudioOrangLain(koneksi.peer, streamLain);
          });
          APP.panggilanSuara.set(koneksi.peer, panggilan);
        }
      });

      koneksi.on('data', (data) => tanganiPesanMasuk(koneksi.peer, data));

      koneksi.on('close', () => {
        APP.koneksiData.delete(koneksi.peer);
        APP.anggotaAktif.delete(koneksi.peer);
        APP.panggilanSuara.delete(koneksi.peer);
        hapusAudioOrangLain(koneksi.peer);
        perbaruiDaftarAnggota();
      });
    }

    function pasangAudioOrangLain(idPeer, stream) {
      let elemenAudio = document.getElementById(`audio-${idPeer}`);
      if (!elemenAudio) {
        elemenAudio = document.createElement('audio');
        elemenAudio.id = `audio-${idPeer}`;
        elemenAudio.autoplay = true;
        elemenAudio.playsInline = true;
        document.body.appendChild(elemenAudio);
      }
      elemenAudio.srcObject = stream;
    }

    function hapusAudioOrangLain(idPeer) {
      const elemenAudio = document.getElementById(`audio-${idPeer}`);
      if (elemenAudio) elemenAudio.remove();
    }

    function tanganiPesanMasuk(idPeer, data) {
      switch (data.tipe) {
        case 'KENALAN':
        case 'MASUK':
          APP.anggotaAktif.set(idPeer, { nama: data.nama || 'Anggota Tidak Dikenal' });
          perbaruiDaftarAnggota();
          break;

        case 'MULAI_BICARA':
          if (APP.sedangBicara) return; // Abaikan jika kita yang lagi ngomong
          APP.sedangMendengar = true;
          APP.namaPembicaraAktif = data.nama;
          bunyiKresekHT();
          tampilanMendengar(true);
          break;

        case 'BERHENTI_BICARA':
          APP.sedangMendengar = false;
          APP.namaPembicaraAktif = null;
          bunyiSelesaiGanti();
          tampilanMendengar(false);
          break;
      }
    }

    function kirimDataKeSemua(data) {
      APP.koneksiData.forEach((koneksi) => {
        if (koneksi.open) koneksi.send(data);
      });
    }

    function mulaiBicara() {
      // Jika jalur dipakai orang, tidak bisa bicara (Half-Duplex)
      if (APP.sedangMendengar) {
        alert("Gantian! Ada yang sedang bicara.");
        return;
      }
      if (APP.sedangBicara) return;

      siapkanAudio();
      if (navigator.vibrate) navigator.vibrate(50); // Getar HP
      
      APP.sedangBicara = true;
      bunyiKresekHT();

      // Nyalakan Mikrofon
      if (APP.streamSaya) {
        APP.streamSaya.getAudioTracks().forEach(track => track.enabled = true);
      }

      kirimDataKeSemua({ tipe: 'MULAI_BICARA', nama: APP.nama });
      tampilanBicara(true);
    }

    function berhentiBicara() {
      if (!APP.sedangBicara) return;
      
      if (navigator.vibrate) navigator.vibrate([30, 30]);

      APP.sedangBicara = false;

      // Matikan Mikrofon
      if (APP.streamSaya) {
        APP.streamSaya.getAudioTracks().forEach(track => track.enabled = false);
      }

      kirimDataKeSemua({ tipe: 'BERHENTI_BICARA', nama: APP.nama });
      bunyiSelesaiGanti();
      tampilanBicara(false);
    }

    function tampilanBicara(aktif) {
      if (aktif) {
        ui.tombolBicara.className = "tombol-ptt aktif w-full py-8 rounded-2xl bg-oranye-500 text-white flex flex-col items-center justify-center select-none border-2 border-oranye-600";
        ui.ikonBicara.className = "fa-solid fa-microphone-lines text-5xl mb-3 text-white animasi-sinyal";
        ui.labelBicara.innerText = "MENGIRIM SUARA...";
        
        ui.teksStatus.innerText = "ANDA SEDANG BICARA";
        ui.teksStatus.className = "text-sm font-bold uppercase mb-1 text-oranye-600 animasi-sinyal";
        ui.teksAktivitas.innerText = "SUARA TERKIRIM";
        ui.teksAktivitas.className = "text-3xl font-black tracking-wider text-oranye-600";
      } else {
        ui.tombolBicara.className = "tombol-ptt-siaga w-full py-8 rounded-2xl bg-laut-700 text-white flex flex-col items-center justify-center cursor-pointer select-none border-2 border-laut-300";
        ui.ikonBicara.className = "fa-solid fa-microphone text-5xl mb-3 text-white";
        ui.labelBicara.innerText = "TEKAN UNTUK BICARA";
        tampilanSiaga();
      }
      perbaruiDaftarAnggota();
    }

    function tampilanMendengar(aktif) {
      if (aktif) {
        ui.tombolBicara.classList.add('opacity-50', 'pointer-events-none');
        
        ui.teksStatus.innerText = "MENERIMA SUARA";
        ui.teksStatus.className = "text-sm font-bold uppercase mb-1 text-hijau animasi-sinyal";
        ui.teksAktivitas.innerText = APP.namaPembicaraAktif;
        ui.teksAktivitas.className = "text-3xl font-black tracking-wider text-laut-900 truncate px-2";
      } else {
        ui.tombolBicara.classList.remove('opacity-50', 'pointer-events-none');
        tampilanSiaga();
      }
      perbaruiDaftarAnggota();
    }

    function tampilanSiaga() {
      ui.teksStatus.innerText = "STATUS RADIO";
      ui.teksStatus.className = "text-sm font-bold uppercase mb-1 text-laut-800";
      ui.teksAktivitas.innerText = "SIAGA";
      ui.teksAktivitas.className = "text-3xl font-black tracking-wider text-laut-900";
    }

    function perbaruiTampilan() {
      ui.tampilJalur.innerHTML = `<i class="fa-solid fa-tower-broadcast"></i> ${APP.jalur}`;
      ui.teksNamaPanggilan.innerText = `NAMA KAPAL: ${APP.nama}`;
      ui.inputNama.value = APP.nama;
      ui.inputJalur.value = APP.jalur;
      perbaruiDaftarAnggota();
    }

    function perbaruiDaftarAnggota() {
      const total = APP.anggotaAktif.size + 1;
      ui.tampilJumlahAnggota.innerText = total;

      ui.daftarAnggota.innerHTML = `
        <div class="flex justify-between items-center bg-laut-900 p-3 rounded-lg border-l-4 ${APP.sedangBicara ? 'border-oranye-500' : 'border-laut-700'} shadow mb-2">
          <span class="font-bold text-white flex items-center gap-2">
             <i class="fa-solid fa-user-circle text-laut-300"></i> ${APP.nama} (Anda)
          </span>
          <span class="text-[10px] font-bold ${APP.sedangBicara ? 'bg-oranye-500/20 text-oranye-500' : 'bg-laut-700/50 text-laut-300'} px-2 py-1 rounded">
            ${APP.sedangBicara ? 'BICARA' : 'SIAGA'}
          </span>
        </div>
      `;

      APP.anggotaAktif.forEach((info, idPeer) => {
        const diaBicara = APP.namaPembicaraAktif === info.nama;
        const div = document.createElement('div');
        div.className = `flex justify-between items-center bg-laut-900 p-3 rounded-lg border-l-4 ${diaBicara ? 'border-hijau' : 'border-laut-800'} shadow mb-2`;
        div.innerHTML = `
          <span class="font-bold text-white flex items-center gap-2 truncate pr-2">
            <i class="fa-solid fa-ship ${diaBicara ? 'text-hijau animasi-sinyal' : 'text-laut-700'}"></i> 
            <span class="truncate">${info.nama}</span>
          </span>
          <span class="text-[10px] font-bold ${diaBicara ? 'bg-hijau/20 text-hijau' : 'bg-laut-800 text-laut-300'} px-2 py-1 rounded">
            ${diaBicara ? 'BICARA' : 'AKTIF'}
          </span>
        `;
        ui.daftarAnggota.appendChild(div);
      });
    }

    function buatVisualizer() {
      ui.visualizerContainer.innerHTML = '';
      for(let i=0; i<10; i++){
        const bar = document.createElement('div');
        bar.className = 'w-2 bg-laut-300 rounded-t-sm transition-all duration-75';
        bar.style.height = '4px';
        bar.id = `vbar-${i}`;
        ui.visualizerContainer.appendChild(bar);
      }
    }

    function renderVisualizer() {
      requestAnimationFrame(renderVisualizer);
      if (!APP.analyserNode) return;

      const bufferLength = APP.analyserNode.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      APP.analyserNode.getByteFrequencyData(dataArray);

      // Ambil 10 sampel untuk 10 bar
      const step = Math.floor(bufferLength / 10);
      
      for (let i = 0; i < 10; i++) {
        const bar = document.getElementById(`vbar-${i}`);
        if(bar) {
          // Normalisasi nilai 0-255 ke tinggi 4px - 32px
          const nilai = dataArray[i * step] || 0;
          const tinggi = Math.max(4, (nilai / 255) * 32);
          bar.style.height = `${tinggi}px`;
          
          if(APP.sedangBicara) {
            bar.className = 'w-2 bg-oranye-500 rounded-t-sm transition-all duration-75';
          } else if (APP.sedangMendengar) {
            bar.className = 'w-2 bg-hijau rounded-t-sm transition-all duration-75';
          } else {
            bar.className = 'w-2 bg-laut-300 rounded-t-sm transition-all duration-75';
          }
        }
      }
    }

    function pasangEvent() {
      // Event Tombol PTT (Dukung Sentuhan HP & Mouse)
      const tanganiTekan = (e) => { e.preventDefault(); mulaiBicara(); };
      const tanganiLepas = (e) => { e.preventDefault(); berhentiBicara(); };

      ui.tombolBicara.addEventListener('mousedown', tanganiTekan);
      ui.tombolBicara.addEventListener('mouseup', tanganiLepas);
      ui.tombolBicara.addEventListener('mouseleave', tanganiLepas);
      
      ui.tombolBicara.addEventListener('touchstart', tanganiTekan, { passive: false });
      ui.tombolBicara.addEventListener('touchend', tanganiLepas, { passive: false });
      ui.tombolBicara.addEventListener('touchcancel', tanganiLepas, { passive: false });

      // Modal Pengaturan
      document.getElementById('btnPengaturan').onclick = () => {
        buatQRCode();
        ui.modalPengaturan.classList.remove('hidden');
      };
      
      document.getElementById('btnTutupPengaturan').onclick = () => ui.modalPengaturan.classList.add('hidden');

      // Simpan Pengaturan
      document.getElementById('btnSimpanJalur').onclick = () => {
        const namaBaru = ui.inputNama.value.trim().toUpperCase() || APP.nama;
        const jalurBaru = ui.inputJalur.value.trim().toUpperCase().replace(/\s+/g, '-') || APP.jalur;

        APP.nama = namaBaru;
        APP.jalur = jalurBaru;
        localStorage.setItem('ht_kp_nama', namaBaru);

        // Update URL biar bisa dibagikan
        const urlBaru = `${window.location.pathname}?jalur=${encodeURIComponent(jalurBaru)}`;
        window.history.replaceState({ path: urlBaru }, '', urlBaru);

        ui.modalPengaturan.classList.add('hidden');
        perbaruiTampilan();

        // Reset koneksi ke jalur baru
        if (APP.peer) APP.peer.destroy();
        sambungkanKeJaringan();
      };

      // Tombol Bagikan
      document.getElementById('btnBagikanLink').onclick = () => {
        const link = window.location.href;
        const teks = `Ayo gabung di HT Jalur ${APP.jalur}! Klik link ini: ${link}`;
        
        if (navigator.share) {
          navigator.share({ title: 'HT KP Nelayan', text: teks, url: link })
            .catch(err => console.warn('Gagal membagikan', err));
        } else {
          // Fallback buka WA Web/App
          window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(teks)}`);
        }
      };

      // Toggle Kresek
      document.getElementById('toggleKresek').onchange = (e) => APP.efekKresekAktif = e.target.checked;
    }

    function buatQRCode() {
      const qrcodeContainer = document.getElementById('qrcode');
      qrcodeContainer.innerHTML = '';
      new QRCode(qrcodeContainer, {
        text: window.location.href,
        width: 150,
        height: 150,
        colorDark: '#052659',
        colorLight: '#ffffff'
      });
    }

    // Memulai Aplikasi saat halaman selesai dimuat
    window.onload = async () => {
      perbaruiTampilan();
      buatVisualizer();
      pasangEvent();
      renderVisualizer();

      // Coba akses mic, kalau dapat langsung konek ke jaringan peer
      const micDiizinkan = await aktifkanMikrofon();
      if (micDiizinkan) {
        sambungkanKeJaringan();
      }
      
      // Munculkan popup pengaturan jika ini kali pertama user masuk tanpa query jalur
      if(!ambilJalurDariUrl() && !localStorage.getItem('ht_kp_nama')) {
         setTimeout(() => {
           buatQRCode();
           ui.modalPengaturan.classList.remove('hidden');
         }, 1000);
      }
    };
  </script>
</body>
</html>
