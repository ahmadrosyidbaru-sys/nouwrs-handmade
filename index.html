<!DOCTYPE html>
<html lang="id" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HT Web - Tactical Radio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- PeerJS for WebRTC P2P Connections -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- MQTT.js for Room Signaling & Discovery -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            tactical: {
              900: '#111312',
              800: '#1a1d1a',
              700: '#2c322d',
              600: '#3f4740',
              500: '#5c6b5d',
            },
            radio: {
              led: '#10b981', // Emerald 500
              ledOff: '#064e3b', // Emerald 900
              ledTx: '#ef4444', // Red 500
            }
          },
          animation: {
            'led-blink': 'blink 1s infinite',
          },
          keyframes: {
            blink: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.4' },
            }
          }
        }
      }
    }
  </script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600;800&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0a0a0a;
      color: #e5e5e5;
      /* Mencegah seleksi teks dan zoom saat menekan tombol PTT */
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
    }
    
    .font-mono-digital {
      font-family: 'Share Tech Mono', monospace;
    }

    /* Styling fisik HT */
    .ht-body {
      background: linear-gradient(145deg, #1f2320, #141715);
      box-shadow: 
        inset 2px 2px 5px rgba(255,255,255,0.05),
        inset -5px -5px 15px rgba(0,0,0,0.8),
        10px 10px 30px rgba(0,0,0,0.9);
      border: 2px solid #2c322d;
    }

    .ht-screen {
      background: #022c22;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      text-shadow: 0 0 5px rgba(16, 185, 129, 0.5);
    }

    .scan-line {
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.1) 50%, rgba(255,255,255,0));
      background-size: 100% 4px;
    }

    /* Push To Talk Button Styling */
    .ptt-btn {
      background: linear-gradient(145deg, #3f4740, #2c322d);
      box-shadow: 
        10px 10px 20px rgba(0,0,0,0.6),
        -5px -5px 15px rgba(255,255,255,0.05),
        inset 1px 1px 2px rgba(255,255,255,0.2);
      transition: all 0.1s ease;
    }
    .ptt-btn:active, .ptt-btn.active-tx {
      background: linear-gradient(145deg, #2c322d, #1a1d1a);
      box-shadow: 
        inset 10px 10px 20px rgba(0,0,0,0.8),
        inset -2px -2px 5px rgba(255,255,255,0.05);
      transform: scale(0.96);
    }
    
    .ptt-btn::after {
      content: '';
      position: absolute;
      top: 15%; left: 15%; right: 15%; bottom: 15%;
      border-radius: 50%;
      background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
    }

    /* Speaker Grill */
    .grill-dot {
      background-color: #0a0a0a;
      box-shadow: inset 1px 1px 2px rgba(0,0,0,0.8), 1px 1px 1px rgba(255,255,255,0.1);
    }
  </style>
</head>
<body class="h-full flex flex-col justify-center items-center overflow-hidden relative">

  <div id="inAppBrowserWarning" class="hidden fixed inset-0 z-[9999] bg-black flex flex-col items-center justify-center p-6 text-center">
    <div class="w-24 h-24 bg-red-500/20 rounded-full flex items-center justify-center mb-6">
      <i class="fa-solid fa-triangle-exclamation text-5xl text-red-500"></i>
    </div>
    <h1 class="text-2xl font-bold text-white mb-3">Gunakan Browser Asli!</h1>
    <p class="text-gray-400 mb-8 max-w-sm">
      Browser dari Instagram/Telegram memblokir akses mikrofon (PTT tidak akan berfungsi). Silakan buka link ini di <span class="text-white font-bold">Chrome</span> atau <span class="text-white font-bold">Safari</span>.
    </p>
    <button id="btnCopyWarningLink" class="w-full max-w-sm py-4 rounded-xl bg-tactical-600 hover:bg-tactical-500 text-white font-bold transition flex items-center justify-center gap-2">
      <i class="fa-regular fa-copy"></i> Salin Link Website
    </button>

  <div id="setupScreen" class="w-full max-w-sm px-6 flex flex-col items-center z-10">
    <div class="w-20 h-20 bg-tactical-800 rounded-2xl flex items-center justify-center mb-6 shadow-2xl border border-tactical-600">
      <i class="fa-solid fa-walkie-talkie text-4xl text-radio-led"></i>
    </div>
    <h1 class="text-3xl font-black text-white mb-2 uppercase tracking-widest text-center">Tacti<span class="text-radio-led">Call</span></h1>
    <p class="text-gray-400 text-sm mb-8 text-center">Web-based Multi-user Walkie Talkie</p>

    <div class="w-full bg-tactical-800 p-6 rounded-2xl border border-tactical-600 shadow-2xl">
      <div class="mb-4">
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Nama Sandi / Panggilan</label>
        <input type="text" id="inputNickname" placeholder="Contoh: Alpha-1" class="w-full bg-tactical-900 border border-tactical-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-radio-led transition text-center font-bold">
      </div>
      <div class="mb-6">
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">ID Frekuensi (Room)</label>
        <input type="text" id="inputRoomId" placeholder="14450" value="14450" class="w-full bg-tactical-900 border border-tactical-600 rounded-lg px-4 py-3 text-radio-led focus:outline-none focus:border-radio-led transition text-center font-mono-digital text-xl tracking-[0.2em]">
      </div>
      <button id="btnJoin" class="w-full py-4 rounded-xl bg-radio-led hover:bg-emerald-400 text-tactical-900 font-black uppercase tracking-widest transition shadow-[0_0_15px_rgba(16,185,129,0.4)]">
        Hubungkan
      </button>
    </div>
  </div>

  <div id="radioScreen" class="hidden w-full max-w-md h-full sm:h-auto sm:max-h-[90vh] flex flex-col items-center p-2 sm:p-4 z-10 relative">
    
    <!-- Antena (Visual only) -->
    <div class="w-4 h-16 sm:h-24 bg-tactical-700 rounded-t-full border-2 border-b-0 border-tactical-900 shadow-inner absolute -top-12 sm:-top-20 left-12"></div>
    <div class="w-6 h-8 bg-tactical-800 border-2 border-b-0 border-tactical-900 rounded-t-lg absolute -top-6 sm:-top-8 right-16"></div>

    <!-- Main HT Body -->
    <div class="ht-body w-full h-full sm:h-[800px] rounded-[2rem] sm:rounded-[3rem] p-4 sm:p-6 flex flex-col relative overflow-hidden">
      
      <!-- Top Panel: LEDs & Brand -->
      <div class="flex justify-between items-center mb-4 px-2">
        <div class="flex gap-2">
          <!-- RX/TX LED -->
          <div id="ledIndicator" class="w-4 h-4 rounded-full bg-radio-ledOff border border-black shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)]"></div>
          <div id="pwrIndicator" class="w-4 h-4 rounded-full bg-radio-led border border-black shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)]"></div>
        </div>
        <div class="text-tactical-500 font-black text-xl tracking-tighter uppercase italic">TactiCall <span class="text-sm">V2</span></div>
      </div>

      <!-- LCD Screen -->
      <div class="w-full bg-black p-2 rounded-xl border-4 border-tactical-700 shadow-inner mb-6 relative">
        <div class="ht-screen w-full h-32 rounded-lg p-3 flex flex-col relative overflow-hidden">
          <div class="absolute inset-0 scan-line opacity-30 pointer-events-none"></div>
          
          <!-- Top Row -->
          <div class="flex justify-between items-start">
            <span class="font-mono-digital text-radio-led text-xs" id="statusText">CONNECTING...</span>
            <div class="flex gap-1">
              <i class="fa-solid fa-signal text-radio-led text-xs"></i>
              <span id="userCount" class="font-mono-digital text-radio-led text-xs">1 P</span>
            </div>
          </div>

          <!-- Main Freq -->
          <div class="flex-1 flex items-center justify-center">
            <span id="displayFreq" class="font-mono-digital text-radio-led text-5xl tracking-widest">---</span>
          </div>

          <!-- Bottom Row -->
          <div class="flex justify-between items-end">
            <span class="font-mono-digital text-radio-led text-xs">FM-N</span>
            <span id="displayNickname" class="font-mono-digital text-radio-led text-xs max-w-[120px] truncate">CALLSIGN</span>
          </div>
        </div>
      </div>

      <!-- Users in Room List -->
      <div class="w-full bg-tactical-800 rounded-xl p-3 border border-tactical-700 mb-6 flex-1 min-h-[100px] overflow-y-auto custom-scrollbar">
        <h3 class="text-[10px] font-bold text-tactical-500 uppercase tracking-widest mb-2 border-b border-tactical-700 pb-1">Anggota Freq</h3>
        <ul id="userList" class="space-y-1.5">
          <!-- Users will be injected here -->
        </ul>
      </div>

      <div class="w-full flex justify-center mb-8">
        <div class="grid grid-cols-8 gap-2 p-2">
          <!-- Generating grill dots visually -->
          <script>
            for(let i=0; i<32; i++) {
              document.write('<div class="w-3 h-3 rounded-full grill-dot"></div>');
            }
          </script>
        </div>
      </div>

      <!-- PTT Button Area -->
      <div class="w-full flex justify-center items-center mt-auto pb-4">
        <button id="btnPTT" class="ptt-btn relative w-32 h-32 rounded-full border-4 border-tactical-900 flex items-center justify-center group outline-none select-none">
          <div class="absolute inset-2 rounded-full border-2 border-tactical-600/30"></div>
          <span class="font-black text-tactical-500 tracking-widest text-lg group-hover:text-tactical-400 group-active:text-radio-led transition-colors">PTT</span>
        </button>
      </div>

      <!-- Utilities -->
      <div class="absolute bottom-6 left-6">
        <button id="btnCopyRoom" class="w-10 h-10 rounded-full bg-tactical-700 hover:bg-tactical-600 border border-tactical-900 flex items-center justify-center text-tactical-400 shadow-lg" title="Salin ID Freq">
          <i class="fa-solid fa-share-nodes"></i>
        </button>
      </div>
      <div class="absolute bottom-6 right-6">
        <button id="btnLeave" class="w-10 h-10 rounded-full bg-tactical-700 hover:bg-red-900/50 border border-tactical-900 flex items-center justify-center text-tactical-400 hover:text-red-500 shadow-lg" title="Tinggalkan Frekuensi">
          <i class="fa-solid fa-power-off"></i>
        </button>
      </div>

    </div>
  </div>

  <!-- Hidden Container for Remote Audios -->
  <div id="audioContainer" class="hidden"></div>

  <script>
    // 1. DETEKSI IN-APP BROWSER
    function detectInAppBrowser() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isInstagram = (ua.indexOf("Instagram") > -1);
      const isTelegram = (ua.indexOf("Telegram") > -1) || (ua.indexOf("FBAV") > -1 && ua.indexOf("FBAN") > -1); 
      const isFacebook = (ua.indexOf("FBAV") > -1) || (ua.indexOf("FBAN") > -1);
      const isLine = (ua.indexOf("Line") > -1);
      const isTikTok = (ua.indexOf("TikTok") > -1) || (ua.indexOf("Bytedance") > -1);
      return (isInstagram || isTelegram || isFacebook || isLine || isTikTok);
    }

    if (detectInAppBrowser()) {
      document.getElementById('inAppBrowserWarning').classList.remove('hidden');
      document.getElementById('btnCopyWarningLink').addEventListener('click', () => {
        navigator.clipboard.writeText(window.location.href).catch(e => {
          const textArea = document.createElement("textarea");
          textArea.value = window.location.href;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
        });
        alert('Link disalin! Buka di Chrome/Safari.');
      });
    }

    // 2. STATE VARIABLES
    let peer = null;
    let mqttClient = null;
    let myPeerId = null;
    let myNickname = 'Alpha-1';
    let currentRoom = null;
    
    let localStream = null;
    let localAudioTrack = null;
    let isTransmitting = false;

    // Menyimpan daftar peer yang terhubung: { peerId: { call: MediaConnection, nickname: string } }
    const connectedPeers = {}; 
    const roomMembers = {}; // Menyimpan data nickname member { peerId: nickname }

    // Audio Context & Nodes untuk Efek Walkie Talkie
    let audioCtx = null;
    let beepOscillator = null;

    // DOM Elements
    const setupScreen = document.getElementById('setupScreen');
    const radioScreen = document.getElementById('radioScreen');
    const inputNickname = document.getElementById('inputNickname');
    const inputRoomId = document.getElementById('inputRoomId');
    const displayFreq = document.getElementById('displayFreq');
    const displayNickname = document.getElementById('displayNickname');
    const statusText = document.getElementById('statusText');
    const userCount = document.getElementById('userCount');
    const userList = document.getElementById('userList');
    const ledIndicator = document.getElementById('ledIndicator');
    const btnPTT = document.getElementById('btnPTT');
    const audioContainer = document.getElementById('audioContainer');

    // Cek URL params untuk auto-fill room
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('freq')) {
      inputRoomId.value = urlParams.get('freq');
    }

    // 3. AUDIO SYSTEM (Beeps & Filters)
    async function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      try {
        // Ambil akses mic HANYA sekali saat join
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { 
            echoCancellation: true, 
            noiseSuppression: true, 
            autoGainControl: true 
          },
          video: false
        });
        
        localAudioTrack = stream.getAudioTracks()[0];
        // DEFAULT: MUTE MIC (Karena PTT)
        localAudioTrack.enabled = false; 

        // Terapkan Filter DSP "Walkie Talkie" ke mic kita untuk dikirim ke orang lain
        const source = audioCtx.createMediaStreamSource(stream);
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1500; // Freq vocal HT
        filter.Q.value = 2.5; // Resonansi
        
        // Kompresor agar suara kencang
        const compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.value = -50;
        compressor.knee.value = 40;
        compressor.ratio.value = 12;
        compressor.attack.value = 0;
        compressor.release.value = 0.25;

        const dest = audioCtx.createMediaStreamDestination();
        
        source.connect(filter);
        filter.connect(compressor);
        compressor.connect(dest);

        localStream = dest.stream; // Ini yang akan dikirim via PeerJS
        return true;
      } catch (err) {
        alert("Akses Mikrofon ditolak! PTT tidak akan berfungsi.");
        console.error(err);
        return false;
      }
    }

    // Fungsi untuk membunyikan nada Roger Beep khas HT
    function playHTBeep(type) {
      if (!audioCtx) return;
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      const now = audioCtx.currentTime;
      if (type === 'start') {
        // Nada saat tombol PTT ditekan
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.1, now + 0.01);
        osc.start(now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.stop(now + 0.1);
      } else if (type === 'end') {
        // Nada ganda khas saat tombol dilepas (Roger beep)
        osc.type = 'square';
        osc.frequency.setValueAtTime(1200, now);
        gain.gain.setValueAtTime(0.05, now);
        
        osc.frequency.setValueAtTime(1600, now + 0.08); // Nada kedua
        
        osc.start(now);
        osc.stop(now + 0.16);
      }
    }

    // 4. NETWORKING (PeerJS & MQTT)
    document.getElementById('btnJoin').addEventListener('click', async () => {
      myNickname = inputNickname.value.trim() || 'Alpha-' + Math.floor(Math.random()*99);
      currentRoom = inputRoomId.value.trim().toUpperCase() || '14450';
      
      // Update UI
      setupScreen.classList.add('hidden');
      radioScreen.classList.remove('hidden');
      displayFreq.innerText = currentRoom;
      displayNickname.innerText = myNickname;
      statusText.innerText = 'INIT AUDIO...';

      const audioReady = await initAudio();
      if (!audioReady) {
        statusText.innerText = 'MIC ERROR';
        return;
      }

      statusText.innerText = 'CONNECTING...';
      initPeerAndSignaling();
    });

    function initPeerAndSignaling() {
      // 4a. Init PeerJS (Untuk Audio Mesh)
      const randomId = 'ht_' + Math.random().toString(36).substring(2, 9);
      peer = new Peer(randomId, {
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:global.stun.twilio.com:3478' }
          ]
        }
      });

      peer.on('open', (id) => {
        myPeerId = id;
        statusText.innerText = 'ONLINE';
        statusText.classList.replace('text-radio-led', 'text-emerald-400');
        
        // Simpan info diri sendiri
        roomMembers[myPeerId] = { nickname: myNickname, isTalking: false };
        updateUserListUI();

        // 4b. Init MQTT (Untuk Discovery Siapa di Room)
        initMQTT();
      });

      // Menerima panggilan dari peer lain di room
      peer.on('call', (call) => {
        // Otomatis angkat dengan localStream kita
        call.answer(localStream);
        handleNewConnection(call);
      });

      peer.on('error', (err) => {
        console.error('PeerJS Error:', err);
        statusText.innerText = 'CONN ERR';
      });
    }

    function initMQTT() {
      const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
      mqttClient = mqtt.connect(brokerUrl, {
        clientId: 'htweb_' + myPeerId,
        clean: true
      });

      const topicRoom = `htweb/room/${currentRoom}`;
      const topicSignal = `htweb/signal/${currentRoom}`; // Untuk status PTT

      mqttClient.on('connect', () => {
        mqttClient.subscribe(topicRoom);
        mqttClient.subscribe(topicSignal);
        
        // Broadcast "Saya Join"
        mqttClient.publish(topicRoom, JSON.stringify({
          type: 'join',
          peerId: myPeerId,
          nickname: myNickname
        }));
      });

      mqttClient.on('message', (topic, message) => {
        try {
          const data = JSON.parse(message.toString());
          
          if (topic === topicRoom) {
            handleRoomMessage(data);
          } else if (topic === topicSignal) {
            handleSignalMessage(data);
          }
        } catch (e) {}
      });
    }

    function handleRoomMessage(data) {
      // Abaikan pesan dari diri sendiri
      if (data.peerId === myPeerId) return;

      if (data.type === 'join') {
        // Ada orang baru masuk. 
        // 1. Simpan nickname-nya
        roomMembers[data.peerId] = { nickname: data.nickname, isTalking: false };
        
        // 2. Balas "Saya sudah di sini" agar dia tahu kita ada
        mqttClient.publish(`htweb/room/${currentRoom}`, JSON.stringify({
          type: 'present',
          peerId: myPeerId,
          nickname: myNickname,
          targetPeerId: data.peerId
        }));

        // 3. TELEPON dia via PeerJS (Hanya salah satu yang nelpon untuk mencegah double connection)
        // Kita bandingkan string ID, yang lebih besar yang nelpon.
        if (myPeerId > data.peerId && !connectedPeers[data.peerId]) {
          const call = peer.call(data.peerId, localStream);
          handleNewConnection(call);
        }
        updateUserListUI();
      } 
      else if (data.type === 'present' && data.targetPeerId === myPeerId) {
        // Menerima balasan dari orang yang sudah ada di room
        roomMembers[data.peerId] = { nickname: data.nickname, isTalking: false };
        
        if (myPeerId > data.peerId && !connectedPeers[data.peerId]) {
          const call = peer.call(data.peerId, localStream);
          handleNewConnection(call);
        }
        updateUserListUI();
      }
      else if (data.type === 'leave') {
        removePeer(data.peerId);
      }
    }

    function handleSignalMessage(data) {
      if (data.peerId === myPeerId) return;

      if (data.type === 'tx_start') {
        // Seseorang menekan PTT
        if (roomMembers[data.peerId]) {
          roomMembers[data.peerId].isTalking = true;
          updateUserListUI();
          // Ubah lampu LED kita jadi hijau terang (RX - Receiving)
          setLed('RX');
        }
      } else if (data.type === 'tx_end') {
        // Seseorang melepas PTT
        if (roomMembers[data.peerId]) {
          roomMembers[data.peerId].isTalking = false;
          updateUserListUI();
          setLed('OFF');
        }
      }
    }

    // Mengelola stream audio masuk
    function handleNewConnection(call) {
      const remotePeerId = call.peer;
      connectedPeers[remotePeerId] = { call: call };

      call.on('stream', (remoteStream) => {
        // Buat elemen audio baru untuk orang ini
        let audioEl = document.getElementById(`audio_${remotePeerId}`);
        if (!audioEl) {
          audioEl = document.createElement('audio');
          audioEl.id = `audio_${remotePeerId}`;
          audioEl.autoplay = true;
          // Opsional: routing melalui AudioContext untuk ditambahkan efek statis HT masuk
          // Namun untuk kesederhanaan dan performa mobile, kita gunakan tag HTML Audio biasa.
          audioContainer.appendChild(audioEl);
        }
        audioEl.srcObject = remoteStream;
      });

      call.on('close', () => removePeer(remotePeerId));
      call.on('error', () => removePeer(remotePeerId));
    }

    function removePeer(id) {
      if (connectedPeers[id]) {
        connectedPeers[id].call.close();
        delete connectedPeers[id];
      }
      const audioEl = document.getElementById(`audio_${id}`);
      if (audioEl) audioEl.remove();
      
      delete roomMembers[id];
      updateUserListUI();
    }

    // 5. USER INTERFACE & PTT LOGIC
    function updateUserListUI() {
      userList.innerHTML = '';
      let count = 0;
      
      for (const [id, data] of Object.entries(roomMembers)) {
        count++;
        const isMe = (id === myPeerId);
        const li = document.createElement('li');
        li.className = `flex items-center justify-between p-2 rounded bg-tactical-900 border ${data.isTalking ? 'border-radio-led bg-emerald-900/30' : 'border-tactical-700'} transition-colors`;
        
        li.innerHTML = `
          <div class="flex items-center gap-2">
            <i class="fa-solid ${isMe ? 'fa-user' : 'fa-headset'} ${data.isTalking ? 'text-radio-led animate-pulse' : 'text-tactical-500'} text-[10px]"></i>
            <span class="text-xs font-bold ${data.isTalking ? 'text-radio-led' : 'text-gray-300'}">${data.nickname} ${isMe ? '(You)' : ''}</span>
          </div>
          ${data.isTalking ? '<i class="fa-solid fa-volume-high text-radio-led text-[10px] animate-pulse"></i>' : ''}
        `;
        userList.appendChild(li);
      }
      userCount.innerText = `${count} P`;
    }

    function setLed(state) {
      // Cek apakah kita sedang TX, jangan override TX dengan RX
      if (isTransmitting && state !== 'TX') return; 

      ledIndicator.className = 'w-4 h-4 rounded-full border border-black shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)]';
      if (state === 'TX') {
        ledIndicator.classList.add('bg-radio-ledTx', 'shadow-[0_0_10px_rgba(239,68,68,0.8)]');
      } else if (state === 'RX') {
        ledIndicator.classList.add('bg-radio-led', 'shadow-[0_0_10px_rgba(16,185,129,0.8)]');
      } else {
        ledIndicator.classList.add('bg-radio-ledOff');
      }
    }

    // Logika PTT (Push To Talk)
    function startTransmit(e) {
      if (e) e.preventDefault();
      if (isTransmitting || !localAudioTrack) return;
      
      isTransmitting = true;
      btnPTT.classList.add('active-tx');
      
      // 1. Unmute mic
      localAudioTrack.enabled = true;
      
      // 2. Play start beep
      playHTBeep('start');
      
      // 3. Nyalakan LED Merah (TX)
      setLed('TX');

      // 4. Broadcast via MQTT bahwa kita bicara
      if(mqttClient) {
        mqttClient.publish(`htweb/signal/${currentRoom}`, JSON.stringify({
          type: 'tx_start',
          peerId: myPeerId
        }));
      }

      // Update UI sendiri
      if (roomMembers[myPeerId]) roomMembers[myPeerId].isTalking = true;
      updateUserListUI();
    }

    function stopTransmit(e) {
      if (e) e.preventDefault();
      if (!isTransmitting || !localAudioTrack) return;
      
      isTransmitting = false;
      btnPTT.classList.remove('active-tx');
      
      // 1. Mute mic
      localAudioTrack.enabled = false;
      
      // 2. Play end beep (Roger)
      playHTBeep('end');
      
      // 3. Matikan LED
      setLed('OFF');

      // 4. Broadcast berhenti
      if(mqttClient) {
        mqttClient.publish(`htweb/signal/${currentRoom}`, JSON.stringify({
          type: 'tx_end',
          peerId: myPeerId
        }));
      }

      // Update UI sendiri
      if (roomMembers[myPeerId]) roomMembers[myPeerId].isTalking = false;
      updateUserListUI();
    }

    // Bind Event Listeners untuk PTT (Support Mouse & Touch)
    btnPTT.addEventListener('mousedown', startTransmit);
    btnPTT.addEventListener('touchstart', startTransmit, {passive: false});
    
    window.addEventListener('mouseup', stopTransmit);
    window.addEventListener('touchend', stopTransmit);

    // Mencegah menu konteks saat menahan tombol di mobile
    btnPTT.addEventListener('contextmenu', e => e.preventDefault());

    // Utilities Buttons
    document.getElementById('btnCopyRoom').addEventListener('click', () => {
      const url = window.location.origin + window.location.pathname + '?freq=' + currentRoom;
      const dummy = document.createElement('input');
      document.body.appendChild(dummy);
      dummy.value = url;
      dummy.select();
      document.execCommand('copy');
      document.body.removeChild(dummy);
      alert('Link Frekuensi disalin!\nBagikan ke teman untuk masuk room yang sama.');
    });

    document.getElementById('btnLeave').addEventListener('click', () => {
      if(mqttClient) {
        mqttClient.publish(`htweb/room/${currentRoom}`, JSON.stringify({
          type: 'leave',
          peerId: myPeerId
        }));
        mqttClient.end();
      }
      if(peer) peer.destroy();
      
      window.location.reload(); // Refresh untuk kembali ke setup
    });

    // Handle close window
    window.addEventListener('beforeunload', () => {
      if(mqttClient && myPeerId) {
        mqttClient.publish(`htweb/room/${currentRoom}`, JSON.stringify({
          type: 'leave',
          peerId: myPeerId
        }));
      }
    });

  </script>
</body>
</html>
