<!DOCTYPE html>
<html lang="id" class="h-full bg-tactical-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TactiCall - Web Handy Talkie</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- PeerJS & MQTT CDN -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>

  <!-- Tailwind Theme Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tactical: {
              950: '#0a0c0a',
              900: '#121614',
              800: '#1b221e',
              700: '#28332d',
              600: '#3a4a41',
              500: '#546b5d',
              400: '#7a9685',
            },
            radio: {
              led: '#10b981',
              ledTx: '#ef4444',
              ledOff: '#064e3b',
              screen: '#022114',
              display: '#052e1c'
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Styles -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600;700;900&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #070907;
      color: #e5e5e5;
      touch-action: manipulation;
    }

    .font-mono-digital {
      font-family: 'Share Tech Mono', monospace;
    }

    /* Grill Speaker Pattern */
    .grill-dot {
      background: radial-gradient(circle, #0c100e 40%, #1b221e 90%);
      box-shadow: inset 1px 1px 2px rgba(0,0,0,0.8);
    }

    /* PTT Button Styling */
    .ptt-btn {
      background: linear-gradient(145deg, #323d37, #1f2723);
      box-shadow: 
        6px 6px 14px rgba(0,0,0,0.8),
        -3px -3px 8px rgba(255,255,255,0.04),
        inset 1px 1px 2px rgba(255,255,255,0.15);
      transition: all 0.08s ease;
      touch-action: none;
    }
    
    .ptt-btn:active, .ptt-btn.active-tx {
      background: linear-gradient(145deg, #18201c, #26332c);
      box-shadow: 
        inset 4px 4px 10px rgba(0,0,0,0.9),
        inset -2px -2px 5px rgba(255,255,255,0.05);
      transform: scale(0.96);
    }

    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #121614;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #28332d;
      border-radius: 2px;
    }
  </style>
</head>
<body class="h-full w-full flex flex-col justify-between items-center overflow-x-hidden selection:bg-emerald-500 selection:text-black p-2 sm:p-4">

    </p>
    <button id="btnCopyWarningLink" class="w-full max-w-sm py-3 rounded-xl bg-tactical-600 text-white font-bold text-xs flex items-center justify-center gap-2">

  <!-- SINGLE PAGE HANDY TALKIE CONTAINER -->
  <div class="w-full max-w-sm my-auto flex flex-col items-center relative">
    
    <!-- Outer Radio Device Body -->
    <div class="w-full bg-tactical-900 border-2 border-tactical-700 rounded-3xl p-4 shadow-2xl flex flex-col items-center relative overflow-hidden">
      
      <!-- Top Decorative Antenna & Switch Knob -->

        <div class="flex items-center gap-2">

        <div class="flex items-center gap-2">

          <div class="flex items-center gap-1 text-gray-400 text-xs bg-tactical-950 px-2 py-0.5 rounded border border-tactical-800">

      <!-- Control Panel / Inputs integrated into HT Header -->
      <div class="w-full bg-tactical-950 p-2.5 rounded-xl border border-tactical-800 mb-3 space-y-2">
        <div class="grid grid-cols-2 gap-2">

          </div>

        <button id="btnConnectToggle" class="w-full py-2.5 rounded-lg bg-radio-led hover:bg-emerald-400 text-tactical-950 font-black uppercase tracking-wider text-xs transition shadow-md flex justify-center items-center gap-2 active:scale-95 cursor-pointer">
          <i class="fa-solid fa-power-off"></i>
          <span id="btnConnectText">HUBUNGKAN FREKUENSI</span>
        </button>
      </div>

      <!-- LCD Screen Display -->
      <div class="w-full bg-radio-screen border-2 border-tactical-700 rounded-xl p-3 mb-3 shadow-inner relative overflow-hidden">
        <div class="absolute inset-0 bg-emerald-500/5 pointer-events-none"></div>
        <div class="flex justify-between items-start mb-1">

        </div>

            <span class="text-xs text-emerald-600 font-mono-digital font-bold">MHz</span>

        </div>
      </div>

      <!-- Active Members List -->
      <div class="w-full bg-tactical-950 rounded-xl p-2.5 border border-tactical-800 mb-3 flex-1 min-h-[95px] max-h-[120px] overflow-y-auto custom-scrollbar">
        <div class="text-[9px] font-bold text-tactical-400 uppercase tracking-widest mb-1.5 border-b border-tactical-800 pb-1 flex justify-between items-center">

      <!-- Speaker Grill Decorative -->
      <div class="w-full flex justify-center mb-3 opacity-70">
        <div class="grid grid-cols-8 gap-1 p-1.5 bg-tactical-950/50 rounded-lg border border-tactical-800">
          <div class="w-2 h-2 rounded-full grill-dot"></div><div class="w-2 h-2 rounded-full grill-dot"></div>
          <div class="w-2 h-2 rounded-full grill-dot"></div><div class="w-2 h-2 rounded-full grill-dot"></div>
          <div class="w-2 h-2 rounded-full grill-dot"></div><div class="w-2 h-2 rounded-full grill-dot"></div>
          <div class="w-2 h-2 rounded-full grill-dot"></div><div class="w-2 h-2 rounded-full grill-dot"></div>
          <div class="w-2 h-2 rounded-full grill-dot"></div><div class="w-2 h-2 rounded-full grill-dot"></div>
          <div class="w-2 h-2 rounded-full grill-dot"></div><div class="w-2 h-2 rounded-full grill-dot"></div>
          <div class="w-2 h-2 rounded-full grill-dot"></div><div class="w-2 h-2 rounded-full grill-dot"></div>
          <div class="w-2 h-2 rounded-full grill-dot"></div><div class="w-2 h-2 rounded-full grill-dot"></div>
        </div>
      </div>

      <!-- PTT Main Push-To-Talk Button -->
      <div class="w-full flex flex-col justify-center items-center pb-1">
        <button id="btnPTT" class="ptt-btn relative w-32 h-32 rounded-full border-4 border-tactical-950 flex flex-col items-center justify-center group outline-none select-none cursor-pointer">
          <div class="absolute inset-1.5 rounded-full border border-tactical-500/20 pointer-events-none"></div>
          <i class="fa-solid fa-microphone text-xl text-tactical-500 group-hover:text-tactical-400 transition-colors pointer-events-none mb-0.5"></i>
          <span class="font-black text-tactical-400 tracking-widest text-base group-hover:text-gray-200 transition-colors pointer-events-none">PTT</span>
          <span id="pttSubtext" class="text-[8px] text-tactical-500 font-bold uppercase tracking-wider pointer-events-none mt-0.5">Tahan Bicara</span>
        </button>
      </div>

      <!-- Bottom Utility Buttons -->
      <div class="w-full flex justify-between items-center mt-3 pt-2.5 border-t border-tactical-800 px-1">
        <button id="btnShareFreq" class="h-9 px-3 rounded-lg bg-tactical-800 hover:bg-tactical-700 border border-tactical-700 flex items-center gap-1.5 text-[11px] font-bold text-tactical-400 active:scale-95 transition" title="Bagikan Frekuensi">
          <i class="fa-solid fa-share-nodes"></i>
          <span>Bagikan</span>
        </button>

        <button id="btnQuickReset" class="h-9 px-3 rounded-lg bg-tactical-800 hover:bg-tactical-700 border border-tactical-700 flex items-center gap-1.5 text-[11px] font-bold text-tactical-400 active:scale-95 transition">
          <i class="fa-solid fa-rotate-right"></i>
          <span>Reset</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Hidden Container for Peer Audio -->
  <div id="audioContainer" class="hidden"></div>

  <script>
    // Toast Notification System
    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `p-3 rounded-xl shadow-xl text-xs font-bold text-white transition-all duration-300 transform translate-y-0 opacity-100 flex items-center gap-2 border ${
        type === 'error' ? 'bg-red-900/90 border-red-600' : type === 'success' ? 'bg-emerald-900/90 border-emerald-500' : 'bg-tactical-800 border-tactical-600'
      }`;
      toast.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-triangle-exclamation text-red-400' : type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-circle-info text-sky-400'}"></i><span>${message}</span>`;
      
      const container = document.getElementById('toastContainer');
      if (container) {
        container.appendChild(toast);
        setTimeout(() => {
          toast.classList.replace('opacity-100', 'opacity-0');
          toast.classList.replace('translate-y-0', '-translate-y-2');
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }
    }

    // In-App Browser Warning Check
    function checkInAppBrowser() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isInstagram = (ua.indexOf("Instagram") > -1);
      const isTelegram = (ua.indexOf("Telegram") > -1); 
      const isFacebook = (ua.indexOf("FBAV") > -1) || (ua.indexOf("FBAN") > -1);
      const isLine = (ua.indexOf("Line") > -1);
      const isTikTok = (ua.indexOf("TikTok") > -1) || (ua.indexOf("Bytedance") > -1);
      return (isInstagram || isTelegram || isFacebook || isLine || isTikTok);
    }

    if (checkInAppBrowser()) {
      document.getElementById('inAppBrowserWarning').classList.remove('hidden');
      document.getElementById('btnCopyWarningLink').addEventListener('click', () => {
        try {
          const dummy = document.createElement('input');
          document.body.appendChild(dummy);
          dummy.value = window.location.href;
          dummy.select();
          document.execCommand('copy');
          document.body.removeChild(dummy);
        } catch(e) {}
        showToast('Link disalin! Buka di Chrome/Safari.', 'success');
      });
    }

    // Application State Variables
    let peer = null;
    let mqttClient = null;
    let myPeerId = null;
    let myNickname = 'Alpha-1';
    let currentRoom = '14450';
    let isConnected = false;

    let localStream = null;
    let localAudioTrack = null;
    let isTransmitting = false;

    const connectedPeers = {}; 
    const roomMembers = {};

    let audioCtx = null;

    // DOM References
    const inputNickname = document.getElementById('inputNickname');
    const inputRoomId = document.getElementById('inputRoomId');
    const btnConnectToggle = document.getElementById('btnConnectToggle');
    const btnConnectText = document.getElementById('btnConnectText');
    const displayFreq = document.getElementById('displayFreq');
    const dispCallsign = document.getElementById('dispCallsign');
    const dispState = document.getElementById('dispState');
    const statusText = document.getElementById('statusText');
    const userCount = document.getElementById('userCount');
    const userList = document.getElementById('userList');
    const ledIndicator = document.getElementById('ledIndicator');
    const btnPTT = document.getElementById('btnPTT');
    const pttSubtext = document.getElementById('pttSubtext');
    const audioContainer = document.getElementById('audioContainer');

    // Auto load frequency from URL parameter if available
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('freq')) {
      inputRoomId.value = urlParams.get('freq');
    }

    // Default Random Nickname Generator
    inputNickname.value = 'Alpha-' + Math.floor(Math.random() * 899 + 100);

    // Audio Initialization & Radio Sound Synthesizer
    async function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { 
            echoCancellation: true, 
            noiseSuppression: true, 
            autoGainControl: true 
          },
          video: false
        });
        
        localAudioTrack = stream.getAudioTracks()[0];
        localAudioTrack.enabled = false; // Mute mic initially

        // Create Bandpass filter to simulate Walkie-Talkie frequency response
        const source = audioCtx.createMediaStreamSource(stream);
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1600;
        filter.Q.value = 2.0;
        
        const compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.value = -45;
        compressor.knee.value = 35;
        compressor.ratio.value = 12;
        compressor.attack.value = 0.005;
        compressor.release.value = 0.2;

        const dest = audioCtx.createMediaStreamDestination();
        
        source.connect(filter);
        filter.connect(compressor);
        compressor.connect(dest);

        localStream = dest.stream;
        return true;
      } catch (err) {
        showToast("Akses Mic gagal: " + err.message, 'error');
        console.error(err);
        return false;
      }
    }

    // Sound effect generator for PTT Beeps
    function playHTBeep(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        const now = audioCtx.currentTime;
        if (type === 'start') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, now);
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.12, now + 0.01);
          osc.start(now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.stop(now + 0.08);
        } else if (type === 'end') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(1200, now);
          gain.gain.setValueAtTime(0.08, now);
          osc.frequency.setValueAtTime(1800, now + 0.06);
          osc.start(now);
          osc.stop(now + 0.12);
        }
      } catch (e) {}
    }

    // Connect / Disconnect Toggle Button Logic
    btnConnectToggle.addEventListener('click', async () => {
      if (isConnected) {
        disconnectRadio();
      } else {
        await connectRadio();
      }
    });

    async function connectRadio() {
      myNickname = inputNickname.value.trim() || ('Alpha-' + Math.floor(Math.random()*899 + 100));
      currentRoom = inputRoomId.value.trim().toUpperCase() || '14450';

      dispCallsign.innerText = myNickname.toUpperCase();
      displayFreq.innerText = (parseFloat(currentRoom) / 100 || 144.50).toFixed(2);
      
      btnConnectText.innerText = 'MEMPROSES...';
      btnConnectToggle.disabled = true;

      const audioReady = await initAudio();
      if (!audioReady) {
        btnConnectText.innerText = 'HUBUNGKAN FREKUENSI';
        btnConnectToggle.disabled = false;
        return;
      }

      statusText.innerText = 'CONNECTING';
      initPeerAndSignaling();
    }

    function disconnectRadio() {
      if (mqttClient) {
        try {
          mqttClient.publish(`htweb/room/${currentRoom}`, JSON.stringify({
            type: 'leave',
            peerId: myPeerId
          }));
          mqttClient.end();
        } catch(e) {}
      }
      if (peer) peer.destroy();

      isConnected = false;
      myPeerId = null;
      btnConnectText.innerText = 'HUBUNGKAN FREKUENSI';
      btnConnectToggle.classList.replace('bg-red-600', 'bg-radio-led');
      btnConnectToggle.classList.replace('hover:bg-red-500', 'hover:bg-emerald-400');
      btnConnectToggle.disabled = false;

      statusText.innerText = 'STANDBY';
      dispState.innerText = 'OFF';
      dispState.className = 'text-[10px] font-bold text-emerald-400 bg-emerald-950/80 px-2 py-0.5 rounded border border-emerald-800/60 uppercase';
      
      setLed('OFF');
      userList.innerHTML = '<li class="text-[11px] text-gray-500 italic text-center py-2">Belum terhubung ke frekuensi</li>';
      userCount.innerText = '0';
      
      showToast('Radio dimatikan.', 'info');
    }

    // PeerJS & MQTT Network Mesh Setup
    function initPeerAndSignaling() {
      const randomId = 'ht_' + Math.random().toString(36).substring(2, 9);
      peer = new Peer(randomId, {
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:global.stun.twilio.com:3478' }
          ]
        }
      });

      peer.on('open', (id) => {
        myPeerId = id;
        isConnected = true;
        
        btnConnectText.innerText = 'PUTUSKAN FREKUENSI';
        btnConnectToggle.classList.replace('bg-radio-led', 'bg-red-600');
        btnConnectToggle.classList.replace('hover:bg-emerald-400', 'hover:bg-red-500');
        btnConnectToggle.disabled = false;

        statusText.innerText = 'ONLINE';
        dispState.innerText = 'READY';
        dispState.className = 'text-[10px] font-bold text-radio-led bg-emerald-950 px-2 py-0.5 rounded border border-emerald-500 uppercase';
        
        showToast('Terhubung ke frekuensi!', 'success');
        
        roomMembers[myPeerId] = { nickname: myNickname, isTalking: false };
        updateUserListUI();

        initMQTT();
      });

      peer.on('call', (call) => {
        call.answer(localStream);
        handleNewConnection(call);
      });

      peer.on('error', (err) => {
        console.error('PeerJS Error:', err);
        statusText.innerText = 'CONN ERR';
        showToast('Gagal terhubung ke peer.', 'error');
        disconnectRadio();
      });
    }

    function initMQTT() {
      const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
      mqttClient = mqtt.connect(brokerUrl, {
        clientId: 'htweb_' + myPeerId,
        clean: true
      });

      const topicRoom = `htweb/room/${currentRoom}`;
      const topicSignal = `htweb/signal/${currentRoom}`;

      mqttClient.on('connect', () => {
        mqttClient.subscribe(topicRoom);
        mqttClient.subscribe(topicSignal);
        
        mqttClient.publish(topicRoom, JSON.stringify({
          type: 'join',
          peerId: myPeerId,
          nickname: myNickname
        }));
      });

      mqttClient.on('message', (topic, message) => {
        try {
          const data = JSON.parse(message.toString());
          if (topic === topicRoom) handleRoomMessage(data);
          else if (topic === topicSignal) handleSignalMessage(data);
        } catch (e) {}
      });
    }

    function handleRoomMessage(data) {
      if (data.peerId === myPeerId) return;

      if (data.type === 'join') {
        roomMembers[data.peerId] = { nickname: data.nickname, isTalking: false };
        
        mqttClient.publish(`htweb/room/${currentRoom}`, JSON.stringify({
          type: 'present',
          peerId: myPeerId,
          nickname: myNickname,
          targetPeerId: data.peerId
        }));

        if (myPeerId > data.peerId && !connectedPeers[data.peerId]) {
          const call = peer.call(data.peerId, localStream);
          handleNewConnection(call);
        }
        updateUserListUI();
      } 
      else if (data.type === 'present' && data.targetPeerId === myPeerId) {
        roomMembers[data.peerId] = { nickname: data.nickname, isTalking: false };
        if (myPeerId > data.peerId && !connectedPeers[data.peerId]) {
          const call = peer.call(data.peerId, localStream);
          handleNewConnection(call);
        }
        updateUserListUI();
      }
      else if (data.type === 'leave') {
        removePeer(data.peerId);
      }
    }

    function handleSignalMessage(data) {
      if (data.peerId === myPeerId) return;

      if (data.type === 'tx_start') {
        if (roomMembers[data.peerId]) {
          roomMembers[data.peerId].isTalking = true;
          updateUserListUI();
          setLed('RX');
        }
      } else if (data.type === 'tx_end') {
        if (roomMembers[data.peerId]) {
          roomMembers[data.peerId].isTalking = false;
          updateUserListUI();
          setLed('OFF');
        }
      }
    }

    function handleNewConnection(call) {
      const remotePeerId = call.peer;
      connectedPeers[remotePeerId] = { call: call };

      call.on('stream', (remoteStream) => {
        let audioEl = document.getElementById(`audio_${remotePeerId}`);
        if (!audioEl) {
          audioEl = document.createElement('audio');
          audioEl.id = `audio_${remotePeerId}`;
          audioEl.autoplay = true;
          audioEl.setAttribute('playsinline', 'true');
          audioContainer.appendChild(audioEl);
        }
        audioEl.srcObject = remoteStream;
        audioEl.play().catch(e => console.error(e));
      });

      call.on('close', () => removePeer(remotePeerId));
      call.on('error', () => removePeer(remotePeerId));
    }

    function removePeer(id) {
      if (connectedPeers[id]) {
        try { connectedPeers[id].call.close(); } catch(e) {}
        delete connectedPeers[id];
      }
      const audioEl = document.getElementById(`audio_${id}`);
      if (audioEl) audioEl.remove();
      
      delete roomMembers[id];
      updateUserListUI();
    }

    function updateUserListUI() {
      userList.innerHTML = '';
      let count = 0;
      
      for (const [id, data] of Object.entries(roomMembers)) {
        count++;
        const isMe = (id === myPeerId);
        const li = document.createElement('li');
        li.className = `flex items-center justify-between p-1.5 rounded-lg bg-tactical-900 border ${data.isTalking ? 'border-radio-led bg-emerald-950/40' : 'border-tactical-800'} transition-colors`;
        
        li.innerHTML = `
          <div class="flex items-center gap-2">
            <i class="fa-solid ${isMe ? 'fa-user' : 'fa-headset'} ${data.isTalking ? 'text-radio-led animate-pulse' : 'text-tactical-500'} text-xs"></i>
            <span class="text-xs font-bold ${data.isTalking ? 'text-radio-led' : 'text-gray-300'}">${data.nickname} ${isMe ? '(Anda)' : ''}</span>
          </div>
          ${data.isTalking ? '<i class="fa-solid fa-volume-high text-radio-led text-xs animate-pulse"></i>' : ''}
        `;
        userList.appendChild(li);
      }
      userCount.innerText = count.toString();
    }

    function setLed(state) {
      if (isTransmitting && state !== 'TX') return; 

      ledIndicator.className = 'w-3.5 h-3.5 rounded-full border border-black shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)]';
      if (state === 'TX') {
        ledIndicator.classList.add('bg-radio-ledTx', 'shadow-[0_0_12px_rgba(239,68,68,0.9)]');
      } else if (state === 'RX') {
        ledIndicator.classList.add('bg-radio-led', 'shadow-[0_0_12px_rgba(16,185,129,0.9)]');
      } else {
        ledIndicator.classList.add('bg-radio-ledOff');
      }
    }

    function startTransmit(e) {
      if (!isConnected) {
        showToast('Klik "HUBUNGKAN FREKUENSI" terlebih dahulu!', 'error');
        return;
      }
      if (isTransmitting || !localAudioTrack) return;
      
      isTransmitting = true;
      btnPTT.classList.add('active-tx');
      pttSubtext.innerText = 'TRANSMITTING';
      pttSubtext.classList.replace('text-tactical-500', 'text-radio-led');
      
      localAudioTrack.enabled = true;
      playHTBeep('start');
      setLed('TX');

      if (navigator.vibrate) navigator.vibrate(40);

      if(mqttClient) {
        mqttClient.publish(`htweb/signal/${currentRoom}`, JSON.stringify({
          type: 'tx_start',
          peerId: myPeerId
        }));
      }

      if (roomMembers[myPeerId]) roomMembers[myPeerId].isTalking = true;
      updateUserListUI();
    }

    function stopTransmit(e) {
      if (!isTransmitting || !localAudioTrack) return;
      
      isTransmitting = false;
      btnPTT.classList.remove('active-tx');
      pttSubtext.innerText = 'Tahan Bicara';
      pttSubtext.classList.replace('text-radio-led', 'text-tactical-500');
      
      localAudioTrack.enabled = false;
      playHTBeep('end');
      setLed('OFF');

      if (navigator.vibrate) navigator.vibrate([20, 30, 20]);

      if(mqttClient) {
        mqttClient.publish(`htweb/signal/${currentRoom}`, JSON.stringify({
          type: 'tx_end',
          peerId: myPeerId
        }));
      }

      if (roomMembers[myPeerId]) roomMembers[myPeerId].isTalking = false;
      updateUserListUI();
    }

    // Universal Pointer Events for PTT Button (Handles Mobile Touch & Mouse Seamlessly)
    btnPTT.addEventListener('pointerdown', startTransmit);
    window.addEventListener('pointerup', stopTransmit);
    window.addEventListener('pointercancel', stopTransmit);

    btnPTT.addEventListener('contextmenu', e => e.preventDefault());

    // Share & Quick Reset Buttons
    document.getElementById('btnShareFreq').addEventListener('click', () => {
      const room = inputRoomId.value.trim() || '14450';
      const url = window.location.origin + window.location.pathname + '?freq=' + room;
      const dummy = document.createElement('input');
      document.body.appendChild(dummy);
      dummy.value = url;
      dummy.select();
      try {
        document.execCommand('copy');
        showToast('Link Frekuensi disalin!', 'success');
      } catch(e) {}
      document.body.removeChild(dummy);
    });

    document.getElementById('btnQuickReset').addEventListener('click', () => {
      disconnectRadio();
      inputNickname.value = 'Alpha-' + Math.floor(Math.random() * 899 + 100);
      inputRoomId.value = '14450';
      showToast('Formulir direset.', 'info');
    });

    window.addEventListener('beforeunload', () => {
      if(mqttClient && myPeerId) {
        mqttClient.publish(`htweb/room/${currentRoom}`, JSON.stringify({
          type: 'leave',
          peerId: myPeerId
        }));
      }
    });
  </script>
</body>
</html>
