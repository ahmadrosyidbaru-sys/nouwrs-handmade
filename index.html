  <title>TactiCall - Web Walkie Talkie</title>

  <!-- Tailwind Theme Configuration -->

              400: '#849b8d',

            }

    }

  <!-- Custom Styles -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600;800;900&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0a0c0a;
      color: #e5e5e5;
    }

    .font-mono-digital {
      font-family: 'Share Tech Mono', monospace;
    }

    /* Grill Speaker Pattern */
    .grill-dot {
      background: radial-gradient(circle, #0e1210 40%, #1f2622 90%);
      box-shadow: inset 1px 1px 2px rgba(0,0,0,0.8);
    }

    /* PTT Button Styling */
    .ptt-btn {
      background: linear-gradient(145deg, #323d37, #212924);
      box-shadow: 
        8px 8px 16px rgba(0,0,0,0.7),
        -4px -4px 12px rgba(255,255,255,0.03),
        inset 1px 1px 2px rgba(255,255,255,0.15);
      transition: all 0.1s ease;
      touch-action: none;
    }
    
    .ptt-btn:active, .ptt-btn.active-tx {
      background: linear-gradient(145deg, #1b221e, #28332d);
      box-shadow: 
        inset 4px 4px 10px rgba(0,0,0,0.8),
        inset -2px -2px 5px rgba(255,255,255,0.05);

    /* Scrollbar Styling */

  </style>

          <div class="w-2.5 h-2.5 rounded-full grill-dot"></div><div class="w-2.5 h-2.5 rounded-full grill-dot"></div>

      <!-- Action Buttons Footer -->

  <!-- Audio Container -->
  <div id="audioContainer" class="hidden"></div>

  <script>
    // Custom Notification Toast Function
    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `p-3 rounded-xl shadow-xl text-xs font-bold text-white transition-all duration-300 transform translate-y-0 opacity-100 flex items-center gap-2 border ${
        type === 'error' ? 'bg-red-900/90 border-red-600' : type === 'success' ? 'bg-emerald-900/90 border-emerald-500' : 'bg-tactical-800 border-tactical-600'
      }`;
      toast.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-triangle-exclamation text-red-400' : type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-circle-info text-sky-400'}"></i><span>${message}</span>`;
      
      const container = document.getElementById('toastContainer');
      if (container) {
        container.appendChild(toast);
        setTimeout(() => {
          toast.classList.replace('opacity-100', 'opacity-0');
          toast.classList.replace('translate-y-0', '-translate-y-2');
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }
    }

    // 1. In-App Browser Detection
    function detectInAppBrowser() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isInstagram = (ua.indexOf("Instagram") > -1);
      const isTelegram = (ua.indexOf("Telegram") > -1); 
      const isFacebook = (ua.indexOf("FBAV") > -1) || (ua.indexOf("FBAN") > -1);
      const isLine = (ua.indexOf("Line") > -1);
      const isTikTok = (ua.indexOf("TikTok") > -1) || (ua.indexOf("Bytedance") > -1);
      return (isInstagram || isTelegram || isFacebook || isLine || isTikTok);
    }

    if (detectInAppBrowser()) {
      document.getElementById('inAppBrowserWarning').classList.remove('hidden');
      document.getElementById('btnCopyWarningLink').addEventListener('click', () => {
        try {
          document.execCommand('copy');
        } catch(e) {}
        showToast('Link disalin! Buka di Chrome/Safari.', 'success');
      });
      document.getElementById('btnCloseWarning').addEventListener('click', () => {
        document.getElementById('inAppBrowserWarning').classList.add('hidden');
      });
    }

    // 2. Application State Variables
    let peer = null;
    let mqttClient = null;
    let myPeerId = null;
    let myNickname = 'Alpha-1';
    let currentRoom = null;
    
    let localStream = null;
    let localAudioTrack = null;
    let isTransmitting = false;

    const connectedPeers = {}; 
    const roomMembers = {};

    let audioCtx = null;

    // DOM References
    const setupScreen = document.getElementById('setupScreen');
    const radioScreen = document.getElementById('radioScreen');
    const inputNickname = document.getElementById('inputNickname');
    const inputRoomId = document.getElementById('inputRoomId');
    const displayFreq = document.getElementById('displayFreq');
    const displayNickname = document.getElementById('displayNickname');
    const statusText = document.getElementById('statusText');
    const userCount = document.getElementById('userCount');
    const userList = document.getElementById('userList');
    const ledIndicator = document.getElementById('ledIndicator');
    const btnPTT = document.getElementById('btnPTT');
    const audioContainer = document.getElementById('audioContainer');

    // Auto load frequency from URL param if available
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('freq')) {
      inputRoomId.value = urlParams.get('freq');
    }

    // 3. Realistic Tactical Audio Synthesizer & Filter System
    async function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { 
            echoCancellation: true, 
            noiseSuppression: true, 
            autoGainControl: true 
          },
          video: false
        });
        
        localAudioTrack = stream.getAudioTracks()[0];
        localAudioTrack.enabled = false; // Mute initially

        // Create Bandpass filter to simulate Walkie-Talkie frequency response
        const source = audioCtx.createMediaStreamSource(stream);
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1600; // Center frequency for radio sound
        filter.Q.value = 2.0;
        
        const compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.value = -45;
        compressor.knee.value = 35;
        compressor.ratio.value = 12;
        compressor.attack.value = 0.005;
        compressor.release.value = 0.2;

        const dest = audioCtx.createMediaStreamDestination();
        
        source.connect(filter);
        filter.connect(compressor);
        compressor.connect(dest);

        localStream = dest.stream;
        return true;
      } catch (err) {
        showToast("Mic gagal diakses: " + err.message, 'error');
        console.error(err);
        return false;
      }
    }

    // Sound effect generator (PTT Start & Roger Beep)
    function playHTBeep(type) {
      if (!audioCtx) return;
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      const now = audioCtx.currentTime;
      if (type === 'start') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.12, now + 0.01);
        osc.start(now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.stop(now + 0.08);
      } else if (type === 'end') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(1200, now);
        gain.gain.setValueAtTime(0.08, now);
        osc.frequency.setValueAtTime(1800, now + 0.06);
        osc.start(now);
        osc.stop(now + 0.12);
      }
    }

    // 4. PeerJS WebRTC & MQTT Signaling Integration
    document.getElementById('btnJoin').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> MEMPROSES...';
      btn.disabled = true;

      myNickname = inputNickname.value.trim() || 'Alpha-' + Math.floor(Math.random()*899 + 100);
      currentRoom = inputRoomId.value.trim().toUpperCase() || '14450';
      
      const audioReady = await initAudio();
      if (!audioReady) {
        btn.innerHTML = originalText;
        btn.disabled = false;
        return;
      }

      setupScreen.classList.add('hidden');
      radioScreen.classList.remove('hidden');
      displayFreq.innerText = (parseFloat(currentRoom) / 100 || 144.50).toFixed(2);
      displayNickname.innerText = myNickname;
      statusText.innerText = 'INIT AUDIO...';

      statusText.innerText = 'CONNECTING...';
      initPeerAndSignaling();
    });

    function initPeerAndSignaling() {
      const randomId = 'ht_' + Math.random().toString(36).substring(2, 9);
      peer = new Peer(randomId, {
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:global.stun.twilio.com:3478' }
          ]
        }
      });

      peer.on('open', (id) => {
        myPeerId = id;
        statusText.innerText = 'ONLINE';
        statusText.classList.replace('text-radio-led', 'text-emerald-400');
        showToast('Terhubung ke frekuensi!', 'success');
        
        roomMembers[myPeerId] = { nickname: myNickname, isTalking: false };
        updateUserListUI();

        initMQTT();
      });

      peer.on('call', (call) => {
        call.answer(localStream);
        handleNewConnection(call);
      });

      peer.on('error', (err) => {
        console.error('PeerJS Error:', err);
        statusText.innerText = 'CONN ERR';
        showToast('Gagal terhubung ke jaringan peer.', 'error');
      });
    }

    function initMQTT() {
      const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
      mqttClient = mqtt.connect(brokerUrl, {
        clientId: 'htweb_' + myPeerId,
        clean: true
      });

      const topicRoom = `htweb/room/${currentRoom}`;
      const topicSignal = `htweb/signal/${currentRoom}`;

      mqttClient.on('connect', () => {
        mqttClient.subscribe(topicRoom);
        mqttClient.subscribe(topicSignal);
        
        mqttClient.publish(topicRoom, JSON.stringify({
          type: 'join',
          peerId: myPeerId,
          nickname: myNickname
        }));
      });

      mqttClient.on('message', (topic, message) => {
        try {
          const data = JSON.parse(message.toString());
          if (topic === topicRoom) handleRoomMessage(data);
          else if (topic === topicSignal) handleSignalMessage(data);
        } catch (e) {}
      });
    }

    function handleRoomMessage(data) {
      if (data.peerId === myPeerId) return;

      if (data.type === 'join') {
        roomMembers[data.peerId] = { nickname: data.nickname, isTalking: false };
        
        mqttClient.publish(`htweb/room/${currentRoom}`, JSON.stringify({
          type: 'present',
          peerId: myPeerId,
          nickname: myNickname,
          targetPeerId: data.peerId
        }));

        if (myPeerId > data.peerId && !connectedPeers[data.peerId]) {
          const call = peer.call(data.peerId, localStream);
          handleNewConnection(call);
        }
        updateUserListUI();
      } 
      else if (data.type === 'present' && data.targetPeerId === myPeerId) {
        roomMembers[data.peerId] = { nickname: data.nickname, isTalking: false };
        if (myPeerId > data.peerId && !connectedPeers[data.peerId]) {
          const call = peer.call(data.peerId, localStream);
          handleNewConnection(call);
        }
        updateUserListUI();
      }
      else if (data.type === 'leave') {
        removePeer(data.peerId);
      }
    }

    function handleSignalMessage(data) {
      if (data.peerId === myPeerId) return;

      if (data.type === 'tx_start') {
        if (roomMembers[data.peerId]) {
          roomMembers[data.peerId].isTalking = true;
          updateUserListUI();
          setLed('RX');
        }
      } else if (data.type === 'tx_end') {
        if (roomMembers[data.peerId]) {
          roomMembers[data.peerId].isTalking = false;
          updateUserListUI();
          setLed('OFF');
        }
      }
    }

    function handleNewConnection(call) {
      const remotePeerId = call.peer;
      connectedPeers[remotePeerId] = { call: call };

      call.on('stream', (remoteStream) => {
        let audioEl = document.getElementById(`audio_${remotePeerId}`);
        if (!audioEl) {
          audioEl = document.createElement('audio');
          audioEl.id = `audio_${remotePeerId}`;
          audioEl.autoplay = true;
          audioEl.setAttribute('playsinline', 'true');
          audioContainer.appendChild(audioEl);
        }
        audioEl.srcObject = remoteStream;
        audioEl.play().catch(e => console.error(e));
      });

      call.on('close', () => removePeer(remotePeerId));
      call.on('error', () => removePeer(remotePeerId));
    }

    function removePeer(id) {
      if (connectedPeers[id]) {
        connectedPeers[id].call.close();
        delete connectedPeers[id];
      }
      const audioEl = document.getElementById(`audio_${id}`);
      if (audioEl) audioEl.remove();
      
      delete roomMembers[id];
      updateUserListUI();
    }

    // 5. User Interface & PTT Controllers
    function updateUserListUI() {
      userList.innerHTML = '';
      let count = 0;
      
      for (const [id, data] of Object.entries(roomMembers)) {
        count++;
        const isMe = (id === myPeerId);
        const li = document.createElement('li');
        li.className = `flex items-center justify-between p-2 rounded-lg bg-tactical-900 border ${data.isTalking ? 'border-radio-led bg-emerald-950/40' : 'border-tactical-800'} transition-colors`;
        
        li.innerHTML = `
          <div class="flex items-center gap-2">
            <i class="fa-solid ${isMe ? 'fa-user' : 'fa-headset'} ${data.isTalking ? 'text-radio-led animate-pulse' : 'text-tactical-500'} text-xs"></i>
            <span class="text-xs font-bold ${data.isTalking ? 'text-radio-led' : 'text-gray-300'}">${data.nickname} ${isMe ? '(Anda)' : ''}</span>
          </div>
          ${data.isTalking ? '<i class="fa-solid fa-volume-high text-radio-led text-xs animate-pulse"></i>' : ''}
        `;
        userList.appendChild(li);
      }
      userCount.innerText = `${count} P`;
    }

    function setLed(state) {
      if (isTransmitting && state !== 'TX') return; 

      ledIndicator.className = 'w-3.5 h-3.5 rounded-full border border-black shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)]';
      if (state === 'TX') {
        ledIndicator.classList.add('bg-radio-ledTx', 'shadow-[0_0_12px_rgba(239,68,68,0.9)]');
      } else if (state === 'RX') {
        ledIndicator.classList.add('bg-radio-led', 'shadow-[0_0_12px_rgba(16,185,129,0.9)]');
      } else {
        ledIndicator.classList.add('bg-radio-ledOff');
      }
    }

    function startTransmit(e) {
      if (e && e.cancelable && e.type === 'touchstart') {
        e.preventDefault();
      }
      if (isTransmitting || !localAudioTrack) return;
      
      isTransmitting = true;
      btnPTT.classList.add('active-tx');
      
      localAudioTrack.enabled = true;
      playHTBeep('start');
      setLed('TX');

      if (navigator.vibrate) navigator.vibrate(40);

      if(mqttClient) {
        mqttClient.publish(`htweb/signal/${currentRoom}`, JSON.stringify({
          type: 'tx_start',
          peerId: myPeerId
        }));
      }

      if (roomMembers[myPeerId]) roomMembers[myPeerId].isTalking = true;
      updateUserListUI();
    }

    function stopTransmit(e) {
      if (e && e.cancelable && (e.type === 'touchend' || e.type === 'touchcancel')) {
        e.preventDefault();
      }
      if (!isTransmitting || !localAudioTrack) return;
      
      isTransmitting = false;
      btnPTT.classList.remove('active-tx');
      
      localAudioTrack.enabled = false;
      playHTBeep('end');
      setLed('OFF');

      if (navigator.vibrate) navigator.vibrate([20, 30, 20]);

      if(mqttClient) {
        mqttClient.publish(`htweb/signal/${currentRoom}`, JSON.stringify({
          type: 'tx_end',
          peerId: myPeerId
        }));
      }

      if (roomMembers[myPeerId]) roomMembers[myPeerId].isTalking = false;
      updateUserListUI();
    }

    // Touch & Mouse Listener bindings for maximum cross-platform support
    btnPTT.addEventListener('touchstart', startTransmit, { passive: false });
    btnPTT.addEventListener('touchend', stopTransmit, { passive: false });
    btnPTT.addEventListener('touchcancel', stopTransmit, { passive: false });

    btnPTT.addEventListener('mousedown', startTransmit);
    btnPTT.addEventListener('mouseup', stopTransmit);
    btnPTT.addEventListener('mouseleave', stopTransmit);

    window.addEventListener('mouseup', stopTransmit);
    window.addEventListener('touchend', stopTransmit);

    btnPTT.addEventListener('contextmenu', e => e.preventDefault());

    // Share & Leave Buttons Logic
    document.getElementById('btnCopyRoom').addEventListener('click', () => {
      const url = window.location.origin + window.location.pathname + '?freq=' + currentRoom;
      const dummy = document.createElement('input');
      document.body.appendChild(dummy);
      dummy.value = url;
      dummy.select();
      try {
        document.execCommand('copy');
      } catch(e) {}
      document.body.removeChild(dummy);
      showToast('Link Frekuensi disalin ke clipboard!', 'success');
    });

    document.getElementById('btnLeave').addEventListener('click', () => {
      if(mqttClient) {
        mqttClient.publish(`htweb/room/${currentRoom}`, JSON.stringify({
          type: 'leave',
          peerId: myPeerId
        }));
        mqttClient.end();
      }
      if(peer) peer.destroy();
      window.location.reload();
    });

    window.addEventListener('beforeunload', () => {
      if(mqttClient && myPeerId) {
        mqttClient.publish(`htweb/room/${currentRoom}`, JSON.stringify({
          type: 'leave',
          peerId: myPeerId
        }));
      }
    });
  </script>
</body>
</html>
